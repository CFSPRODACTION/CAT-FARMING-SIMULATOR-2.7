<style>

#bl{left:14px;bottom:22px}#br{left:94px;bottom:22px}#bg{right:14px;bottom:106px}#bb{right:14px;bottom:22px;background:#ef476f}#exitv{right:100px;bottom:22px}#horn{right:100px;bottom:88px}

.row2{flex-wrap:wrap}.tb{font-size:11px;padding:6px 2px;min-width:30%}

.paws span{display:inline-block;font-size:20px;opacity:0;margin:4px;animation:fi 1s forwards}.paws span:nth-child(1){animation-delay:.3s}.paws span:nth-child(2){animation-delay:.7s}.paws span:nth-child(3){animation-delay:1.1s}
.st1{font-size:34px;font-weight:bold;letter-spacing:4px;color:#ffd166;opacity:0;transform:translateY(14px);animation:fi 1.2s 1s forwards;text-shadow:0 0 20px #ffd16699}
.st2{font-size:22px;color:#fff;letter-spacing:6px;opacity:0;transform:translateY(14px);animation:fi 1.2s 1.7s forwards}@keyframes fi{to{opacity:1;transform:none}}

#prod{position:fixed;inset:0;z-index:60;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .8s}
.pt{color:#fff;font-size:30px;font-weight:bold;letter-spacing:8px;text-align:center;opacity:0;animation:pf 2.4s .5s ease-in forwards;text-shadow:0 0 18px #ffffff88}@keyframes pf{to{opacity:1}}
#splash:not(.go) *{animation-play-state:paused}

/* 2.7: landscape */
#menu{align-items:flex-start;justify-content:flex-start}#menu .mc{margin:auto}
#rot{position:fixed;inset:0;z-index:45;background:#0b1030;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;touch-action:auto}

@media (orientation:landscape) and (max-height:520px){
 #hud{padding:2px 10px;font-size:12px;border-bottom-width:2px}
 #seeds{padding:3px;gap:3px;border-top-width:2px}.sd{font-size:9px;padding:1px 0;line-height:1.1;border-width:2px}.sd b{font-size:15px}

 .help{max-height:55vh}#card{max-height:96%}
 .ia{font-size:44px}.it2{min-height:64px;font-size:14px;margin-top:8px}
}

</style></head><body>
<div id="app"><div id="hud"><span>🪙 <span id="coins">0</span></span><span id="lv"></span><span id="clk"></span><span onclick="menu('main')" style="font-size:18px">☰</span></div>
<div id="wrap"><canvas id="c"></canvas><div id="vig"></div><div id="info"></div><div id="nav"></div><button id="snd">🔊</button><button class="zb" id="zin" style="right:46px">＋</button><button class="zb" id="zout" style="right:6px">－</button><canvas id="mm" width="182" height="70"></canvas><div id="joy"><div id="knob"></div></div><div id="spd"></div><button class="pd" id="bl">◀</button><button class="pd" id="br">▶</button><button class="pd big" id="bg">⬆</button><button class="pd" id="bb">⬇</button><button id="exitv">🚪</button><button id="horn">📯</button><button id="bag">🎒</button><button id="run">🏃</button><div id="toast"></div><div id="ov"><div id="card"></div></div></div>
<div id="seeds"></div></div>
<div id="menu"></div><div id="intro"></div><div id="rot"><div class="ri">📱</div><p>Cat Farming Simulator грають <b>горизонтально</b>.<br>Поверни телефон, щоб почати 🐱</p><button id="rotok">Все одно грати так</button></div><div id="prod"><div class="pt">CFS PRODUCTION</div></div><div id="splash"><div class="sl"><div class="cat">🐱</div><div class="paws"><span>🐾</span><span>🐾</span><span>🐾</span></div><div class="st1">CAT FARMING</div><div class="st2">SIMULATOR 2.7</div><div class="bar"><i></i></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const CROPS=[
 {id:'carrot',n:'Морква',e:'🥕',cost:5,t:6,p:12,col:'#f77f00',need:1},
 {id:'tomato',n:'Томат',e:'🍅',cost:12,t:10,p:30,col:'#e63946',need:1},
 {id:'straw',n:'Полуниця',e:'🍓',cost:25,t:16,p:70,col:'#ff4d6d',need:2},
 {id:'pump',n:'Гарбуз',e:'🎃',cost:60,t:26,p:180,col:'#ff9e00',need:3},
 {id:'apple',n:'Яблуко',e:'🍎',cost:150,t:40,p:450,col:'#d00000',need:4}];
const ANIMALS={
 hen:{n:'Курка',e:'🐔',pr:'egg',pe:'🥚',cost:40,t:12,p:9,need:1,home:0},
 sheep:{n:'Вівця',e:'🐑',pr:'wool',pe:'🧶',cost:150,t:25,p:38,need:2,home:1},
 cow:{n:'Корова',e:'🐄',pr:'milk',pe:'🥛',cost:300,t:35,p:70,need:3,home:1},
 pig:{n:'Свиня',e:'🐖',pr:'truffle',pe:'🍄',cost:450,t:45,p:120,need:4,home:1}};
const ITEMS=[...CROPS.map(c=>({id:c.id,e:c.e,p:c.p})),...Object.values(ANIMALS).map(a=>({id:a.pr,e:a.pe,p:a.p})),{id:'fish',e:'🐟',p:45},{id:'wheat',e:'🌾',p:8},{id:'mush',e:'🍄',p:14},{id:'berry',e:'🫐',p:11},{id:'rock',e:'🪨',p:9},{id:'meat',e:'🥩',p:32},{id:'bread',e:'🍞',p:40},{id:'roast',e:'🍖',p:110},{id:'pie',e:'🥧',p:85},{id:'bakedm',e:'🍲',p:55},{id:'omelet',e:'🍳',p:35}];
const MAXP=24,TW=46,TH=36,VW=180,VH=290,WW=14000,WH=3600;
const fresh=()=>({coins:20000,house:1,kiosk:1,plots:4,sel:0,inv:{},grid:Array(MAXP).fill(null),an:[],debt:0,veh:{car:1},vspd:0,fx:[0,0,0],fw:[Array(16).fill(0),Array(16).fill(0),Array(16).fill(0)],gun:0,ammo:0,bake:null,ord:null,ordD:-1,gt:0,paid:0,season:0,sT:0,cl:{own:['hat0','hat9','top0','pn0','acc0'],worn:{hat:'hat0',top:'top0',pants:'pn0',acc:'acc0'}},wheat:Array(16).fill(0)});
let S=fresh(),NEWG=0;
try{const s=localStorage.getItem('pixfarm3');if(s)S=Object.assign(fresh(),JSON.parse(s));else NEWG=1}catch(e){}
const save=()=>{try{localStorage.setItem('pixfarm3',JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const speed=()=>(1+0.2*(S.house-1))*(RAIN&&S.season!==3?1.25:1)*[1.15,1,1,.6][S.season||0],mult=()=>1+0.25*(S.kiosk-1);
const cv=$('c');
const pp=i=>({x:12+(i%6)*50,y:104+Math.floor(i/6)*44});
const cam={x:0,y:0};
function toast(t){const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,2000)}
function fit(){const w=$('wrap');const s=Math.max(1,Math.floor(Math.min(w.clientWidth/VW,w.clientHeight/VH)*4)/4);cv.style.width=VW*s+'px';cv.style.height=VH*s+'px'}
addEventListener('resize',fit);
const R=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h)};
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const tufts=[],flowers=[],trees=[];
for(let i=0;i<120;i++)tufts.push([rnd()*WW|0,(90+rnd()*390)|0]);
for(let i=0;i<30;i++)flowers.push([rnd()*WW|0,(86+rnd()*390)|0,['#fff','#ffd166','#ff8fab','#b8c0ff'][i%4]]);
[[90,56],[170,60],[200,56],[290,60],[310,300],[6,480-30],[150,300]].forEach(t=>trees.push(t));
const P={x:90,y:92,tx:null,ty:null,act:null,dir:1,f:0,fish:0};
const dog={x:70,y:96,d:1},bf=[0,1,2,3].map(i=>({x:40+i*70,y:120+i*50,p:i*2}));
const floats=[];
const say=(t,x,y,c)=>floats.push({t,x,y,c:c||'#fff',a:0});
function go(x,y,act){P.fish=0;P.tx=Math.max(8,Math.min(WW-8,x));P.ty=Math.max(84,Math.min(WH-4,y));P.act=act||null}
function input(e){
 const r=cv.getBoundingClientRect(),mx=(e.clientX-r.left)*VW/r.width+cam.x,my=(e.clientY-r.top)*VH/r.height+cam.y;
 if(e.type==='pointerdown'){
  for(const a of S.an)if(Math.abs(mx-a.x)<11&&my<a.y+3&&my>a.y-18)return go(a.x,a.y+4,{k:'animal'});
  if(mx>6&&mx<80&&my<86)return go(40,86,{k:'house'});
  if(mx>100&&mx<178&&my<86)return go(138,86,{k:'kiosk'});
  if(mx>222&&mx<306&&my>40&&my<96)return go(264,102,{k:'fish'});
  for(const L of LAKES)if(Math.hypot(mx-L.x,my-L.y)<L.r)return go(L.sx,L.sy,{k:'fish',L});
  if(mx>10&&mx<80&&my>290&&my<346)return go(45,352,{k:'coop'});
  if(mx>236&&mx<312&&my>286&&my<346)return go(274,352,{k:'barn'});
  for(let i=0;i<MAXP;i++){const {x,y}=pp(i);if(mx>=x&&mx<x+TW&&my>=y&&my<y+TH)return go(x+TW/2,y+TH+3,{k:'plot',i})}
 }
 go(mx,my);
}
// 2.6: multi-touch — pinch to zoom with two fingers; extra fingers never trigger stray taps
const TP=new Map();let pz0=0,zm0=1.75;
const tpd=()=>{const a=[...TP.values()];return a.length<2?0:(Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1)};
cv.addEventListener('pointerdown',e=>{if($('ov').style.display==='flex')return;try{cv.setPointerCapture(e.pointerId)}catch(_){}
 TP.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(TP.size>=2){cv.dn=0;P.tx=null;P.act=null;pz0=tpd();zm0=ZM;return}
 if(KS.l||KS.r||KS.g||KS.b)return;
 cv.dn=1;input(e)});
cv.addEventListener('pointermove',e=>{const q=TP.get(e.pointerId);if(!q)return;q.x=e.clientX;q.y=e.clientY;
 if(TP.size>=2){const d=tpd();if(pz0>0)ZM=Math.max(1,Math.min(3.2,zm0*pz0/d));return}
 if(cv.dn&&P.act==null)input(e)});
const tpe=e=>{TP.delete(e.pointerId);cv.dn=0;if(TP.size>=2){pz0=tpd();zm0=ZM}};
cv.addEventListener('pointerup',tpe);cv.addEventListener('pointercancel',tpe);cv.addEventListener('lostpointercapture',tpe);
addEventListener('gesturestart',e=>e.preventDefault());
const ready=a=>(Date.now()-a.s)/1000*speed()>=ANIMALS[a.t].t;
function arrive(a){
 if(a.k==='kiosk')return openKiosk();
 if(a.k==='house')return openHouse();
 if(a.k==='coop')return openBuy(0);
 if(a.k==='barn')return openBuy(1);

window.loan=a=>{S.coins+=a;S.debt+=Math.round(a*1.2);bmsg='Отримано '+a+' 🪙';ui();save();menu('bank')};
window.repay=n=>{n=Math.min(n,S.debt,S.coins);if(n<=0)return;S.coins-=n;S.debt-=n;bmsg=S.debt?'Повернуто '+n+' 🪙':'Борг сплачено! 🎉';ui();save();menu('bank')};

// ===== 2.7 «Горизонт»: landscape start =====
const touchy=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window;let rotSkip=false,fsTried=false;
function chkRot(){const r=$('rot');if(r)r.style.display=(touchy&&!rotSkip&&innerHeight>innerWidth)?'flex':'none'}
function lockLand(){try{const o=screen.orientation;if(o&&o.lock){const q=o.lock('landscape');if(q&&q.catch)q.catch(()=>{})}}catch(e){}}
function goLand(){if(!touchy)return;lockLand();if(fsTried||document.fullscreenElement)return;fsTried=true;const el=document.documentElement,rq=el.requestFullscreen||el.webkitRequestFullscreen;
 if(rq){try{const q=rq.call(el);if(q&&q.then)q.then(lockLand).catch(()=>{})}catch(e){}}}
addEventListener('resize',chkRot);addEventListener('orientationchange',()=>setTimeout(chkRot,250));
document.addEventListener('pointerup',goLand,true);document.addEventListener('click',goLand,true);
$('rotok').onclick=()=>{rotSkip=true;chkRot()};chkRot();lockLand();
fit();ui();menu('main');introShow();requestAnimationFrame(frame);setInterval(ui,1500);
